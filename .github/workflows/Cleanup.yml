
name: Cleanup

# Удаляет все завершённые запуски workflow старше 12 часов,
# включая GitHub Pages, вместе с логами и артефактами.
on:
  schedule:
    # Каждые 3 часа. Время — UTC.
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Delete completed runs older than 12 hours
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Рассчитываем границу: 12 часов назад, UTC.
        CUTOFF=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

        echo ">>> Удаляются все завершённые запуски старше $CUTOFF (UTC)"

        # Получаем последние 500 запусков всех workflow.
        RUNS=$(gh run list --limit 500 \
          --json databaseId,createdAt,status)

        # Выбираем завершённые запуски, созданные более 12 часов назад.
        IDS=$(printf '%s' "$RUNS" | jq -r --arg c "$CUTOFF" \
          '.[] | select(.status == "completed" and .createdAt < $c) | .databaseId')

        if [ -z "$IDS" ]; then
          echo ">>> Нет завершённых запусков старше 12 часов."
          exit 0
        fi

        n=0

        # Удаляем каждый подходящий запуск.
        for ID in $IDS; do
          if gh run delete "$ID" >/dev/null; then
            n=$((n + 1))
          else
            echo "::warning::Не удалось удалить запуск $ID"
          fi
        done

        echo ">>> Удалено запусков: $n"
