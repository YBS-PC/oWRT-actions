name: Universal WRT Builder

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Device (combo: R6S-homeproxy + RB5009-clear + RB5009-switch; AGH/sing-box/ytb/zz1 задаёт сам)'
        required: true
        default: 'combo'
        type: choice
        options:
          - combo
          - rb5009
          - nanopi-r6s
          - nanopi-r5s
          - slateax
          - ax59u
          - brume2
          - all
      
      source:
        description: 'Source Code'
        required: true
        default: 'openwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      
      branch:
        description: 'Branch'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
          - master
          - openwrt-24.10
          - openwrt-25.12
      
      variant:
        description: 'Build Variant (в combo игнорируется)'
        required: true
        default: 'homeproxy'
        type: choice
        options:
          - homeproxy
          - rehomeproxy
          - clear
          - switch
          - crystal_clear
          - podkop
          - netshift
          - forkop
          - forkop-mod
          - trafira
          - passwall
          - v2raya
          - xray

      runner_os:
        description: 'Runner image (22.04 устаревает)'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04

      agh:
        description: 'AdGuard Home: no — нет, feed — из фида, latest — фид + свежий бинарник (в combo игнорируется)'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'no'
          - 'feed'
          - 'latest'

      sb:
        description: 'sing-box: no — нет, feed — из фида, версия — фид + скачанный бинарник (в combo игнорируется)'
        required: true
        type: choice
        default: 'feed'
        options:
          - 'no'
          - 'feed'
          - '1.12.x'
          - '1.13.x'
          - '1.14.x'
          - 'latest'
          - 'extended'
          - 'podkop-engine'
          - 'podkop-engine-full'

      ytb:
        description: 'youtubeUnblock (в combo игнорируется)'
        required: true
        type: boolean
        default: true

      zz:
        description: 'Скрипт первой настройки zz1 в uci-defaults (в combo игнорируется)'
        required: true
        type: boolean
        default: true
      
      apply_patches:
        description: 'Применять патчи из patches/ и всех подпапок (в combo задаётся матрицей)'
        required: true
        type: boolean
        default: true

      stop_outdated_patches:
        description: 'Останавливать сборку, если патч устарел: у автора изменился файл, к которому он применяется (уведомление в Telegram; снять — патч пропускается с предупреждением)'
        required: true
        type: boolean
        default: true

      feeds_latest:
        description: 'Фиды packages/luci/routing/telephony/video — коммиты репозитория пакетов (как после apk upgrade), а не тега релиза (в combo задаётся матрицей)'
        required: true
        type: boolean
        default: true

      exclude_keywords:
        description: 'Exclude Packages (Space separated keywords)'
        required: false
        default: ''
        type: string
      
      commit_hash:
        description: 'Target Commit Hash (Optional)'
        required: false
        default: ''

env:
  CONFIG_FILE: ./config/WRT.config
  # 1. Источники
  DIY_P1_SH: ./sh/WRT-part1.sh
  # 2. Фиксы (между update и install)
  DIY_P2_SH: ./sh/WRT-part2.sh
  # 3. Пакеты и настройка (после install)
  DIY_P3_SH: ./sh/WRT-part3.sh

  TZ: Europe/Moscow

  # Сверка исходников с патчами (sh/patch-drift.sh): если у автора фида или
  # пакета изменился файл, к которому применяется наш патч, эта сборка
  # останавливается до компиляции и в Telegram приходит список патчей,
  # которые надо обновить. Включается галочкой формы stop_outdated_patches
  # (по умолчанию включена; действует и в combo). "0" — без сверки: прежнее
  # поведение (патч, который не ложится, пропускается с предупреждением).
  PATCH_DRIFT_CHECK: ${{ inputs.stop_outdated_patches && '1' || '0' }}

  # Фиды forkop, формат «имя URL;ветка». Какой из них подключить, выбирает
  # поле формы Build Variant: forkop — оригинал, forkop-mod — форк (внутри
  # сборки оба — вариант forkop, различается только фид). Имя фида = имя
  # подпапки с его патчами: patches/feeds/<имя>/ (WRT-part2.sh применяет
  # подпапку того фида, который реально загружен, остальные пропускает).
  # Версия пакета берётся из тегов этого же репозитория.
  #   патчи patches/feeds/forkop (25 шт., включая всё рабочее из форка)
  FORKOP_FEED_ORIG: "forkop https://github.com/ushan0v/forkop.git;main"
  #   патч  patches/feeds/forkopmod (001, для 1.0.9: без него исключённые
  #   устройства не получают правил «напрямую», «apk del forkop» падает)
  FORKOP_FEED_MOD: "forkopmod https://github.com/Gavr1024/forkop-mod.git;main"

  # Фид trafira (продолжение forkop: Alice Mode, DoH mTLS, Zapret/Zapret2/
  # ByeDPI в секциях). Отдельный вариант trafira, свой конфиг
  # /etc/config/trafira. Патчи patches/feeds/trafira (001 — без него
  # установка sing-box со страницы «Компоненты» падает; 002 — правило fw4
  # для TPROXY в образе прошивки; 003 — Exclude BitTorrent). Версия пакета —
  # из тегов этого репозитория (TRAFIRA_VERSION).
  TRAFIRA_FEED: "trafira https://github.com/petrouspetr-pixel/trafira.git;main"

  # Фид netshift (форк podkop от yandexru45: подписки с группами и
  # автовыбором, переключение sing-box ↔ sing-box-extended (xhttp) из LuCI,
  # IPv6, блокировка DoH). Как podkop: shell + jq, конфиг /etc/config/netshift,
  # DNS 127.0.0.42:53, youtubeUnblock совместим. Патчи patches/feeds/netshift
  # (001 — разбор ссылок: socks5, транспорт http, синтаксис jq 1.7 для 24.10;
  # 002 — SRV/PTR мимо FakeIP,
  # диагностика DNS с портом). Версия — из тегов (NETSHIFT_VERSION).
  NETSHIFT_FEED: "netshift https://github.com/yandexru45/netshift.git;main"

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ${{ inputs.runner_os }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT_TARGET="${{ inputs.target }}"
          INPUT_VARIANT="${{ inputs.variant }}"
          INPUT_AGH="${{ inputs.agh }}"
          INPUT_SB="${{ inputs.sb }}"
          INPUT_YTB="${{ inputs.ytb }}"
          INPUT_ZZ="${{ inputs.zz }}"
          INPUT_PATCHES="${{ inputs.apply_patches }}"
          INPUT_FEEDS="${{ inputs.feeds_latest }}"

          # Каждая сборка матрицы несёт СВОИ настройки:
          #   agh     — "no" (убрать из прошивки), "feed" (пакет из фида),
          #             "latest" (пакет + свежий бинарник с GitHub поверх);
          #   sb      — "no", "feed", "1.12.x".."latest", "extended" (скачанный
          #             бинарник поверх пакета), "podkop-engine" /
          #             "podkop-engine-full" (FiyeroT/podkop-engine: бинарник и
          #             файлы пакета поверх sing-box из фида; только podkop и
          #             netshift) или "tiny" (выставляется здесь для
          #             slateax/ax59u: part3 ставит им sing-box-tiny);
          #   ytb     — true/false (JSON-булево), ставить ли youtubeUnblock;
          #   zz      — true/false, класть ли zz1-final-offline-setup.sh;
          #   patches — true/false, применять ли ЛЮБЫЕ пользовательские
          #             патчи из patches/ и подпапок;
          #   feeds   — true/false, фиды packages/luci/routing/telephony/video
          #             на коммитах репозитория пакетов (sh/feeds-from-repo.sh),
          #             иначе — на коммитах релизного тега.
          #
          # В combo значения заданы здесь и не зависят от полей формы.
          # Специализированные патчи:
          #   patches/feeds/*    -> WRT-part2.sh
          #   patches/packages/* -> WRT-part3.sh
          # Обычные патчи к дереву OpenWrt применяются этим workflow.
          #
          # Все поля должны присутствовать в JSON, иначе fromJson получит
          # невалидную матрицу.
          #
          # ВНИМАНИЕ: slateax и ax59u — «тонкие» устройства: part3 ставит им
          # пакет sing-box-tiny из фида и удаляет скачанный бинарник, поэтому
          # выбор версии sing-box на них не влияет (в матрице sb=tiny). С
          # патчами homeproxy (patches/packages/luci-app-homeproxy/004, 006)
          # генератор сам подстраивается под версию из фида (1.13+). Без патчей
          # генератор несовместим с sing-box 1.13+, и в варианте homeproxy эти
          # сборки честно упадут на «Check sing-box compatibility» (до
          # компиляции, остальные продолжатся: fail-fast: false).
          TINY_TARGETS="slateax ax59u"
          NOTES=""

          # entry <target> <variant> <agh> <sb> <ytb> <zz> <patches> <feeds>
          # Приводит выбор к тому, что вариант реально допускает, чтобы имя
          # артефакта не врало: clear/crystal_clear/switch вырезают AGH,
          # sing-box и youtubeUnblock; passwall/v2raya/xray — sing-box;
          # forkop и trafira — youtubeUnblock (у них свой Zapret/ByeDPI на
          # nfqueue); crystal_clear — zz1. homeproxy, rehomeproxy
          # podkop и netshift без sing-box не работают (podkop и netshift ещё
          # и тянут его зависимостью); rehomeproxy (Re:HomeProxy) умеет и hiddify-core,
          # но его приложение ставит само уже на роутере.
          entry() {
            local t="$1" v="$2" agh="$3" sb="$4" ytb="$5" zz="$6" pt="$7" fd="$8" orig
            # vname — имя варианта для людей (имя job и артефакта); fk — фид
            # forkop. forkop-mod внутри сборки — тот же вариант forkop, только
            # с фидом форка: part2/part3/zz1 различать их не нужно.
            local vname="$v" fk=""
            case "$v" in
              forkop)     fk=forkop ;;
              forkop-mod) v=forkop; fk=forkopmod ;;
            esac
            orig="agh=$agh sb=$sb ytb=$ytb zz=$zz"
            case "$v" in
              clear|crystal_clear|switch) agh=no; sb=no; ytb=false ;;
              passwall|v2raya|xray)       sb=no ;;
              forkop|trafira)             ytb=false ;;
            esac
            [ "$v" = "crystal_clear" ] && zz=false
            case "$v" in
              homeproxy|rehomeproxy|podkop|netshift) [ "$sb" = "no" ] && sb=feed ;;
            esac
            # podkop-engine — sing-box под podkop: входы только tproxy, direct и
            # mixed, без TUN и redirect (их берут homeproxy и rehomeproxy), а
            # forkop и trafira ставят ядро сами со страницы «Компоненты». Поэтому
            # только podkop и netshift. netshift пишет и выходы vmess/http,
            # которые есть лишь в podkop-engine-full.
            case "$sb" in
              podkop-engine|podkop-engine-full)
                case "$v" in
                  podkop)   ;;
                  netshift) sb=podkop-engine-full ;;
                  *)        sb=feed ;;
                esac ;;
            esac
            case " $TINY_TARGETS " in
              *" $t "*) case "$v" in homeproxy|rehomeproxy|podkop|netshift|forkop|trafira) [ "$sb" != "no" ] && sb=tiny ;; esac ;;
            esac
            if [ "$orig" != "agh=$agh sb=$sb ytb=$ytb zz=$zz" ]; then
              NOTES="${NOTES}${t}/${vname}: ${orig} -> agh=$agh sb=$sb ytb=$ytb zz=$zz\n"
            fi
            printf '{"target":"%s","variant":"%s","vname":"%s","fk":"%s","agh":"%s","sb":"%s","ytb":%s,"zz":%s,"patches":%s,"feeds":%s}' \
              "$t" "$v" "$vname" "$fk" "$agh" "$sb" "$ytb" "$zz" "$pt" "$fd"
          }

          if [ "$INPUT_TARGET" == "combo" ]; then
            echo ">>> Generating COMBO matrix..."
            # Поля: устройство вариант agh sb ytb zz patches feeds.
            # feeds=true — фиды из репозитория пакетов (обновлений после
            # прошивки почти нет); поставьте false для сборки на коммитах тега.
            #   R6S homeproxy: AGH latest, sing-box latest, ytb, zz1, патчи
            #     (с sing-box 1.13+ homeproxy работает только с патчами 004/006)
            #   RB5009 clear и RB5009 switch: без AGH/sing-box/ytb, zz1, без патчей
            # $(entry ...) — подстановка: в ней NOTES не сохраняется, для
            # combo это и не нужно (значения ниже уже согласованы с вариантами).
            # Запасные сборки (дописать в include через запятую):
            #   $(entry nanopi-r6s homeproxy latest 1.12.x true true false true)
            #   $(entry nanopi-r6s forkop latest extended false true true true)
            json="{\"include\":[$(entry nanopi-r6s homeproxy latest latest true true true true),$(entry rb5009 clear no no false true false true),$(entry rb5009 switch no no false true false true)]}"
          else
            # Все устройства из config/conf/ — при добавлении нового дописать сюда.
            targets="nanopi-r6s nanopi-r5s rb5009 slateax ax59u brume2"
            if [ "$INPUT_TARGET" == "all" ]; then
              selected=$targets
            else
              selected="$INPUT_TARGET"
            fi
            json_parts=""
            for t in $selected; do
              [ -n "$json_parts" ] && json_parts="$json_parts,"
              # Без подстановки $(...): entry дописывает NOTES, а подоболочка
              # эти изменения потеряла бы.
              entry "$t" "$INPUT_VARIANT" "$INPUT_AGH" "$INPUT_SB" "$INPUT_YTB" "$INPUT_ZZ" "$INPUT_PATCHES" "$INPUT_FEEDS" > /tmp/entry.json
              json_parts="$json_parts$(cat /tmp/entry.json)"
            done
            json="{\"include\":[$json_parts]}"
          fi

          # Невалидный JSON уронил бы fromJson уже в джобе build с невнятной
          # ошибкой — проверяем здесь.
          if ! echo "$json" | jq -e . >/dev/null; then
            echo "::error::Сгенерирована некорректная матрица: $json"
            exit 1
          fi
          echo "=========================================="
          echo "       [SETUP SUMMARY]                    "
          echo "=========================================="
          echo "Mode: $INPUT_TARGET"
          echo "Generated Matrix:"
          echo "$json" | jq -r '.include[] | "  \(.target) / \(.vname) / agh=\(.agh) / sb=\(.sb) / ytb=\(.ytb) / zz=\(.zz) / patches=\(.patches) / feeds=\(if .feeds then "repo" else "tag" end)"'
          echo "=========================================="
          if [ -n "$NOTES" ]; then
            echo "Выбор формы приведён к возможностям варианта/устройства:"
            printf '%b' "$NOTES" | sed 's/^/  /'
            printf '%b' "$NOTES" | while IFS= read -r n; do
              [ -n "$n" ] && echo "::notice title=Выбор скорректирован::$n"
            done
          fi

          # Заранее предупреждаем о сборках homeproxy без патчей, которые
          # остановятся на проверке совместимости: без патча 004 генератор
          # homeproxy принимает только sing-box 1.12. В фиде 25.12: в теге
          # 25.12.5 — 1.12.x, в репозитории пакетов (feeds_latest) — 1.13.x;
          # на slateax/ax59u — sing-box-tiny из фида (sb=tiny).
          echo "$json" | jq -r '.include[] | select(.variant == "homeproxy" and .patches == false and (.sb != "1.12.x")) | "\(.target) \(.sb)"' |
          while read -r t sbv; do
            echo "::warning title=${t}: homeproxy без патчей (sb=${sbv})::Без патча 004 homeproxy несовместим с sing-box 1.13+, и сборка ${t} остановится на проверке совместимости до компиляции (если в фиде 1.13+). Включите apply_patches или выберите sb=1.12.x."
          done

          # Re:HomeProxy без патчей: генератор форка пишет DNS-серверам detour
          # на пустой direct-out — обычный sing-box (фид, 1.12.x..latest, tiny)
          # такой конфиг не запускает ни в одном режиме; работает только
          # sing-box-extended (и hiddify-core). Патч 001 это исправляет.
          echo "$json" | jq -r '.include[] | select(.variant == "rehomeproxy" and .patches == false and .sb != "extended") | "\(.target) \(.sb)"' |
          while read -r t sbv; do
            echo "::warning title=${t}: Re:HomeProxy без патчей (sb=${sbv})::Без патча 001 (patches/packages/luci-app-re-homeproxy) Re:HomeProxy не запускается на обычном sing-box: «detour to an empty direct outbound makes no sense». Включите apply_patches или выберите sb=extended."
          done

          # forkop без патчей (фид — поле fk матрицы, адреса — в env):
          #   ushan0v/forkop 1.0.5 не стартует на sing-box 1.14 (issue #98);
          #   Gavr1024/forkop-mod без патча 001 — вызовы ucode до объявления
          #   (исключённые устройства идут через прокси) и prerm на ucode (apk).
          for FK_NAME in $(echo "$json" | jq -r '[.include[] | select(.variant == "forkop" and .patches == false) | .fk] | unique | .[]'); do
            case "$FK_NAME" in
              forkop)    FK_WHY="Пока автор не внёс исправления, оригинал ushan0v/forkop несовместим с sing-box 1.14 (issue #98): не скачивайте sing-box 1.14.x/latest/extended для этой сборки" ;;
              forkopmod) FK_WHY="Без патча 001 в форке Gavr1024/forkop-mod исключённые устройства (routing_excluded_ips) не получают правил «напрямую» и идут через прокси (ucode: left-hand side is not a function), а «apk del forkop» падает на prerm" ;;
              *)         FK_WHY="Исправления из patches/feeds/${FK_NAME} не будут применены" ;;
            esac
            echo "::warning title=forkop без патчей::Фид ${FK_NAME} собирается без patches/feeds/${FK_NAME}. ${FK_WHY}. Включите apply_patches."
          done

          # trafira без патчей: собирается, но установка/обновление sing-box со
          # страницы «Компоненты» падает (ucode: left-hand side is not a
          # function, патч 001), а в образе нет правила fw4 для TPROXY —
          # гостевые зоны с input=REJECT режут проксируемый трафик (патч 002).
          echo "$json" | jq -r '.include[] | select(.variant == "trafira" and .patches == false) | .target' |
          while read -r t; do
            echo "::warning title=${t}: trafira без патчей::Без патчей patches/feeds/trafira установка и обновление sing-box из LuCI trafira падают с ошибкой ucode (001), в прошивке нет правила fw4 для TPROXY — зоны с input=REJECT (гостевые) режут проксируемый трафик (002), нет настройки Exclude BitTorrent (003). Включите apply_patches."
          done

          # netshift без патчей: ссылки socks5 с ':' в логине/пароле дают
          # нерабочий узел, VLESS/Trojan с транспортом http пропускаются, на
          # 24.10 (jq 1.7) не строятся узлы с TLS/Reality и подписки,
          # SRV/PTR/TXT к доменам из списков остаются без ответа.
          echo "$json" | jq -r '.include[] | select(.variant == "netshift" and .patches == false) | .target' |
          while read -r t; do
            echo "::warning title=${t}: netshift без патчей::Без patches/feeds/netshift ссылки socks5 с ':' в логине или пароле дают нерабочий узел, ссылки с транспортом http пропускаются, а на OpenWrt 24.10 (jq 1.7) не создаются узлы с TLS/Reality и не работают подписки (001); DNS-запросы SRV/PTR/TXT к доменам из списков остаются без ответа (002). Включите apply_patches."
          done

          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$json" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ${{ inputs.runner_os }}
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    name: ${{ inputs.source }} ${{ inputs.branch }} [${{ matrix.vname }}] - ${{ matrix.target }} (agh:${{ matrix.agh }}, sb:${{ matrix.sb }}, ytb:${{ matrix.ytb }}, zz:${{ matrix.zz }}, patches:${{ matrix.patches }}, feeds:${{ matrix.feeds && 'repo' || 'tag' }})

    steps:
    - name: Free up disk space
      run: |
        echo ">>> Freeing up disk space"
        echo "Initial space:"
        df -h
        
        echo "--- Removing large directories ---"
        # Удаляем Android SDK, .NET, Haskell, Azure, Java (JVM)
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/lib/jvm
        sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        
        echo "--- Removing Docker images (Crucial step!) ---"
        # Это освобождает около 3-4 ГБ
        sudo docker image prune --all --force || true
        
        echo "--- Removing unnecessary packages ---"
        # Удаляем браузеры, базы данных и лишние языки
        sudo apt-get -y purge "azure*" "dotnet*" "ghc*" "llvm*" "mono*" "android*" "google*" "firefox*" "powershell*" "mysql*" "php*" || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        
        echo "Final space:"
        df -h

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set permissions
      run: |
        [ -d "./files/usr/bin" ] && find ./files/usr/bin -maxdepth 1 -type f -exec chmod 755 {} + || true
        [ -d "./files/etc/uci-defaults" ] && find ./files/etc/uci-defaults -maxdepth 1 -type f -exec chmod 755 {} + || true
        
        echo "=========================================="
        echo "       [PERMISSIONS SUMMARY]              "
        echo "=========================================="
        echo "Permissions set for ./files/usr/bin and uci-defaults."
        [ -d "./files/usr/bin" ] && ls -l ./files/usr/bin | head -n 5 || echo "No custom bins"
        echo "=========================================="

    - name: Download AdGuardHome
      # Только agh=latest. Для clear/crystal_clear/switch job setup уже
      # привёл agh к "no", поэтому отдельная проверка варианта не нужна.
      if: matrix.agh == 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # AdGuardHome
        AGH_REPO="AdguardTeam/AdGuardHome"
        AGH_ASSET="AdGuardHome_linux_arm64.tar.gz"
        # Последний стабильный тег — через git ls-remote, как у sing-box: без
        # лимитов API, сортировка по версии, бета-теги (v0.108.0-b.N) отсекаются.
        # Архив и файл сумм качаем по этому тегу: две ссылки на «latest» могли
        # бы попасть в разные релизы, если новый выйдет между запросами.
        AGH_TAG=$(git ls-remote --tags --refs "https://github.com/${AGH_REPO}.git" 2>/dev/null \
            | awk '{print $2}' | sed 's|refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
        if [ -z "$AGH_TAG" ]; then
            echo ">>> WARNING: не удалось определить последний релиз AdGuardHome. Skipping."
            echo ">>> AdGuardHome from OpenWrt feed/package will be used instead."
            exit 0
        fi
        AGH_URL="https://github.com/${AGH_REPO}/releases/download/${AGH_TAG}/${AGH_ASSET}"
        echo ">>> Downloading AdGuardHome ${AGH_TAG} from: $AGH_URL"
        # -f: при 404 GitHub отдаёт HTML-страницу, без -f она сохранилась бы как архив
        curl -fL --retry 3 -o AGH.tar.gz "$AGH_URL" || true
        # Проверка целостности: пустой/битый архив -> graceful skip (как у sing-box).
        # AGH всё равно соберётся из пакета (CONFIG_PACKAGE_adguardhome=y в WRT.config).
        if [ ! -s AGH.tar.gz ]; then
            echo ">>> WARNING: AdGuardHome download is empty or missing. Skipping."
            echo ">>> AdGuardHome from OpenWrt feed/package will be used instead."
            rm -f AGH.tar.gz
            exit 0
        fi
        if ! bash ./sh/verify-sha256.sh AGH.tar.gz "$AGH_REPO" "$AGH_TAG" "$AGH_ASSET" \
                "https://github.com/${AGH_REPO}/releases/download/${AGH_TAG}/checksums.txt"; then
            echo ">>> WARNING: AdGuardHome checksum mismatch. Skipping."
            echo ">>> AdGuardHome from OpenWrt feed/package will be used instead."
            rm -f AGH.tar.gz
            exit 0
        fi
        if ! tar -xzf AGH.tar.gz; then
            echo ">>> WARNING: AdGuardHome archive is corrupt (tar failed). Skipping."
            rm -f AGH.tar.gz
            exit 0
        fi
        mkdir -p ./files/usr/bin
        cp ./AdGuardHome/AdGuardHome ./files/usr/bin/ && chmod 755 ./files/usr/bin/AdGuardHome
        rm -rf AGH.tar.gz AdGuardHome
        echo "=========================================="
        echo "Files in destination:"
        ls -lh ./files/usr/bin/
        echo "=========================================="
        
    - name: Download Sing-box
      # Только при выбранной версии. no/feed/tiny — без загрузки; для чистых
      # сборок и вариантов со своими прокси-ядрами setup уже привёл sb к "no".
      if: matrix.sb != 'no' && matrix.sb != 'feed' && matrix.sb != 'tiny'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SB_VERSION_CHOICE="${{ matrix.sb }}"
        SB_TAG=""
        SB_URL=""
        SB_REPO="SagerNet/sing-box"

        # Последний стабильный тег SagerNet/sing-box через git ls-remote.
        # Раньше тег искали в первой странице API (releases?per_page=100),
        # отсортированной по ДАТЕ: альфы новых веток выходят каждую неделю и
        # выдавливают старую ветку на вторую страницу — фильтр возвращал пусто,
        # шаг молча завершался, а в прошивку уезжал sing-box из фида.
        # ls-remote: без пагинации и лимитов API, сортировка по ВЕРСИИ.
        # $1 — ветка ("1.12"); пусто — любая ветка.
        sb_latest_tag() {
            local branch="$1" pattern
            if [ -n "$branch" ]; then
                pattern="^v${branch//./\\.}\\.[0-9]+$"
            else
                pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
            fi
            git ls-remote --tags --refs "https://github.com/${SB_REPO}.git" 2>/dev/null \
                | awk '{print $2}' | sed 's|refs/tags/||' \
                | grep -E "$pattern" | sort -V | tail -n1
        }

        if [ "$SB_VERSION_CHOICE" == "latest" ] || [[ "$SB_VERSION_CHOICE" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
            # latest — последний стабильный вообще; X.Y.x — последний стабильный в ветке
            if [ "$SB_VERSION_CHOICE" == "latest" ]; then
                SB_TAG=$(sb_latest_tag "")
            else
                SB_TAG=$(sb_latest_tag "${SB_VERSION_CHOICE%.x}")
            fi
            if [ -z "$SB_TAG" ]; then
                echo ">>> WARNING: Could not find any stable $SB_VERSION_CHOICE release. Skipping."
                echo ">>> Sing-box from OpenWrt feed will be used instead."
                exit 0
            fi
            # Из тега v1.12.25 формируем имя файла: sing-box-1.12.25-linux-arm64.tar.gz
            SB_URL="https://github.com/${SB_REPO}/releases/download/${SB_TAG}/sing-box-${SB_TAG#v}-linux-arm64.tar.gz"
        elif [ "$SB_VERSION_CHOICE" == "extended" ]; then
            # Тоже через ls-remote, без API: сбой API (лимит, 401) молча
            # подменил бы выбранный extended на sing-box из фида.
            # Стабильные теги: v1.14.1-extended-2.7.2; rc/beta/alpha и
            # служебный тег «version» отсекаются шаблоном.
            SB_REPO="shtorm-7/sing-box-extended"
            SB_TAG=$(git ls-remote --tags --refs "https://github.com/${SB_REPO}.git" 2>/dev/null \
                | awk '{print $2}' | sed 's|refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-extended-[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V | tail -n1)
            if [ -z "$SB_TAG" ]; then
                echo ">>> WARNING: Could not find any stable sing-box-extended release. Skipping."
                echo ">>> Sing-box from OpenWrt feed will be used instead."
                exit 0
            fi
            # Имя ассета по той же схеме, что у SagerNet:
            # sing-box-1.14.1-extended-2.7.2-linux-arm64.tar.gz
            SB_URL="https://github.com/${SB_REPO}/releases/download/${SB_TAG}/sing-box-${SB_TAG#v}-linux-arm64.tar.gz"
        elif [ "$SB_VERSION_CHOICE" == "podkop-engine" ] || [ "$SB_VERSION_CHOICE" == "podkop-engine-full" ]; then
            # FiyeroT/podkop-engine: sing-box с патчами под podkop (REALITY для
            # Xray 26.9+, xhttp, tools decode-link, резервные выходы urltest,
            # failsafe). Выпускается пакетами под каждую pkgarch, а не архивом
            # arm64, и кроме бинарника несёт свои init-скрипты, хуки и
            # /etc/config/sing-box — их тоже кладём в files/, поверх пакета
            # sing-box из фида (podkop зависит от него, пользователь и права
            # остаются его). Берём .ipk (tar.gz) и для 25.12: содержимое то же,
            # что в .apk, бинарник — под тот же musl 1.2.5.
            SB_REPO="FiyeroT/podkop-engine"
            PE_PKG="$SB_VERSION_CHOICE"
            PE_ARCH=$(sed -n 's/.*CONFIG_TARGET_ARCH_PACKAGES="\([^"]*\)".*/\1/p' "./config/conf/${{ matrix.target }}" | head -n1)
            if [ -z "$PE_ARCH" ]; then
                echo "::warning title=podkop-engine пропущен::Не найдена архитектура пакетов в config/conf/${{ matrix.target }}. Будет использован sing-box из фида."
                exit 0
            fi
            # Теги v<sing-box>-r<ревизия>: последний по версии sing-box и ревизии.
            SB_TAG=$(git ls-remote --tags --refs "https://github.com/${SB_REPO}.git" 2>/dev/null \
                | awk '{print $2}' | sed 's|refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$' | sort -V | tail -n1)
            if [ -z "$SB_TAG" ]; then
                echo ">>> WARNING: Could not find any podkop-engine release. Skipping."
                echo ">>> Sing-box from OpenWrt feed will be used instead."
                exit 0
            fi
            PE_ASSET="${PE_PKG}_${SB_TAG#v}_openwrt_${PE_ARCH}.ipk"
            SB_URL="https://github.com/${SB_REPO}/releases/download/${SB_TAG}/${PE_ASSET}"
            if ! curl -fsSL --retry 3 -o pe.ipk "$SB_URL" || [ ! -s pe.ipk ]; then
                echo "::warning title=podkop-engine пропущен::Не удалось скачать $SB_URL. Будет использован sing-box из фида."
                rm -f pe.ipk
                exit 0
            fi
            if ! bash ./sh/verify-sha256.sh pe.ipk "$SB_REPO" "$SB_TAG" "$PE_ASSET" \
                    "https://github.com/${SB_REPO}/releases/download/${SB_TAG}/SHA256SUMS"; then
                echo ">>> WARNING: podkop-engine checksum mismatch. Skipping."
                echo ">>> Sing-box from OpenWrt feed will be used instead."
                rm -f pe.ipk
                exit 0
            fi
            PE_UNPACK=$(mktemp -d)
            if ! tar -xzf pe.ipk -C "$PE_UNPACK" || ! mkdir -p "$PE_UNPACK/data" \
                    || ! tar -xzf "$PE_UNPACK/data.tar.gz" -C "$PE_UNPACK/data" \
                    || [ ! -f "$PE_UNPACK/data/usr/bin/sing-box" ]; then
                echo "::warning title=podkop-engine пропущен::$PE_ASSET не распаковался или в нём нет usr/bin/sing-box. Будет использован sing-box из фида."
                rm -rf pe.ipk "$PE_UNPACK"
                exit 0
            fi
            SB_INTERP=$(readelf -l "$PE_UNPACK/data/usr/bin/sing-box" 2>/dev/null | sed -n 's/.*interpreter: \(.*\)]/\1/p')
            if [ -n "$SB_INTERP" ] && [[ "$SB_INTERP" != *ld-musl* ]]; then
                echo "::warning title=podkop-engine не для musl::$PE_ASSET собран под $SB_INTERP. Будет использован sing-box из фида."
                rm -rf pe.ipk "$PE_UNPACK"
                exit 0
            fi
            # Весь пакет — в files/ с сохранением путей и прав: бинарник,
            # /etc/init.d/sing-box (лимит дескрипторов, term_timeout, переменные
            # хуков), /etc/init.d/podkop-engine (failsafe), uci-defaults,
            # /usr/libexec/podkop-engine, /etc/config/sing-box, keep.d.
            mkdir -p ./files
            cp -a "$PE_UNPACK/data/." ./files/
            # Службы из files/ сами не включаются (это делает postinst пакета,
            # а его здесь нет): failsafe включаем ссылкой, как /etc/init.d/x enable.
            # START=95 — из самого скрипта.
            PE_START=$(sed -n 's/^START=\([0-9]*\).*/\1/p' ./files/etc/init.d/podkop-engine)
            mkdir -p ./files/etc/rc.d
            ln -sf ../init.d/podkop-engine "./files/etc/rc.d/S${PE_START:-95}podkop-engine"
            rm -rf pe.ipk "$PE_UNPACK"
            echo "SB_DOWNLOADED_TAG=$SB_TAG" >> $GITHUB_ENV
            echo "SB_DOWNLOADED_REPO=$SB_REPO" >> $GITHUB_ENV
            echo "=========================================="
            echo "       [SING-BOX DOWNLOAD SUMMARY]        "
            echo "=========================================="
            echo "Version choice : $SB_VERSION_CHOICE"
            echo "Repository     : $SB_REPO"
            echo "Downloaded tag : $SB_TAG"
            echo "Asset          : $PE_ASSET"
            echo "Linkage        : ${SB_INTERP:-static}"
            echo "Files in destination:"
            find ./files/usr/bin/sing-box ./files/etc/init.d/sing-box ./files/etc/init.d/podkop-engine \
                ./files/etc/rc.d/S*podkop-engine ./files/etc/config/sing-box ./files/etc/sing-box \
                ./files/etc/uci-defaults/99-podkop-engine ./files/usr/libexec/podkop-engine \
                ./files/lib/upgrade/keep.d/podkop-engine* -maxdepth 1 2>/dev/null | xargs ls -ld
            echo "=========================================="
            exit 0
        else
            echo "::error::Неизвестный выбор версии sing-box: '$SB_VERSION_CHOICE'"
            exit 1
        fi
        # С 1.13 SagerNet кладёт в «-linux-arm64.tar.gz» (и «-glibc») бинарник
        # под glibc (динамический, /lib/ld-linux-aarch64.so.1, ради libcronet) —
        # на musl OpenWrt он даёт «/usr/bin/sing-box: not found», а LuCI
        # homeproxy без тегов из «sing-box version» прячет Hysteria/TUIC и т.п.
        # Статическая сборка (та же, что в официальном openwrt .ipk) лежит в
        # «-linux-arm64-musl.tar.gz»; у 1.12 такого ассета нет (404), там
        # обычный архив и так статический. Поэтому сначала -musl, затем обычный.
        SB_URL_MUSL="${SB_URL%.tar.gz}-musl.tar.gz"
        # -f: при 404 GitHub отдаёт HTML-страницу; без -f она сохранялась как
        # непустой sb.tar.gz, проходила проверку -s и роняла шаг уже на tar.
        if curl -fsSL --retry 3 -o sb.tar.gz "$SB_URL_MUSL" && [ -s sb.tar.gz ]; then
            SB_URL="$SB_URL_MUSL"
        elif ! curl -fL --retry 3 -o sb.tar.gz "$SB_URL" || [ ! -s sb.tar.gz ]; then
            echo ">>> WARNING: Download failed or file is empty. Skipping."
            echo ">>> Sing-box from OpenWrt feed will be used instead."
            rm -f sb.tar.gz
            exit 0
        fi
        echo ">>> Downloaded sing-box ($SB_VERSION_CHOICE) from: $SB_URL"
        # Сумма из digest ассета в GitHub API (файлов сумм sing-box не публикует)
        if ! bash ./sh/verify-sha256.sh sb.tar.gz "$SB_REPO" "$SB_TAG" "$(basename "$SB_URL")"; then
            echo ">>> WARNING: sing-box checksum mismatch. Skipping."
            echo ">>> Sing-box from OpenWrt feed will be used instead."
            rm -f sb.tar.gz
            exit 0
        fi
        SB_UNPACK=$(mktemp -d)
        tar -xzf sb.tar.gz -C "$SB_UNPACK"
        mkdir -p ./files/usr/bin
        # cp sing-box-*/sing-box ./files/usr/bin/ && chmod 755 ./files/usr/bin/sing-box
        SB_BINARY_PATH=$(find "$SB_UNPACK" -type f -name sing-box | head -n 1)
        if [ -z "$SB_BINARY_PATH" ]; then
            echo ">>> WARNING: sing-box binary not found in archive. Skipping."
            rm -rf sb.tar.gz "$SB_UNPACK"
            exit 0
        fi
        # Бинарник под glibc на OpenWrt не запустится: лучше sing-box из фида,
        # чем прошивка с неработающим /usr/bin/sing-box.
        SB_INTERP=$(readelf -l "$SB_BINARY_PATH" 2>/dev/null | sed -n 's/.*interpreter: \(.*\)]/\1/p')
        if [ -n "$SB_INTERP" ] && [[ "$SB_INTERP" != *ld-musl* ]]; then
            echo "::warning title=sing-box не для musl::$(basename "$SB_URL") собран под $SB_INTERP и не запустится на OpenWrt. Будет использован sing-box из фида."
            rm -rf sb.tar.gz "$SB_UNPACK"
            exit 0
        fi
        mv -f "$SB_BINARY_PATH" ./files/usr/bin/sing-box && chmod 755 ./files/usr/bin/sing-box
        rm -rf sb.tar.gz "$SB_UNPACK"
        # Для шага «Check sing-box compatibility»: какой именно бинарник в files/
        echo "SB_DOWNLOADED_TAG=$SB_TAG" >> $GITHUB_ENV
        echo "SB_DOWNLOADED_REPO=$SB_REPO" >> $GITHUB_ENV
        echo "=========================================="
        echo "       [SING-BOX DOWNLOAD SUMMARY]        "
        echo "=========================================="
        echo "Version choice : $SB_VERSION_CHOICE"
        echo "Repository     : $SB_REPO"
        echo "Downloaded tag : $SB_TAG"
        echo "Asset          : $(basename "$SB_URL")"
        echo "Linkage        : ${SB_INTERP:-static}"
        echo "Files in destination:"
        ls -lh ./files/usr/bin/
        echo "=========================================="

    - name: Configure Build Variables
      env:
        # Поля формы — через env, а не подстановкой ${{ }} в текст скрипта:
        # иначе их содержимое исполнялось бы как shell-код.
        MANUAL_COMMIT: ${{ inputs.commit_hash }}
        EXCLUDE_INPUT: ${{ inputs.exclude_keywords }}
      run: |
        # 1. URL репозитория исходников
        if [ "${{ inputs.source }}" == "immortalwrt" ]; then
          VAR_REPO_URL="https://github.com/immortalwrt/immortalwrt.git"
        else
          VAR_REPO_URL="https://github.com/openwrt/openwrt.git"
        fi
        echo "REPO_URL=$VAR_REPO_URL" >> $GITHUB_ENV

        # Хеш коммита из формы: только hex, иначе git checkout получил бы
        # произвольную строку (ветку, опцию и т.п.)
        if [ -n "$MANUAL_COMMIT" ] && ! [[ "$MANUAL_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::Некорректный commit_hash: '$MANUAL_COMMIT' (нужно 7–40 hex-символов)"
            exit 1
        fi
        MANUAL_COMMIT="${MANUAL_COMMIT,,}"

        # 2. Логика Ветки
        INPUT_BRANCH="${{ inputs.branch }}"

        VAR_BRANCH="$INPUT_BRANCH"
        VAR_TARGET_RELEASE=""
        VAR_COMMIT_HASH="$MANUAL_COMMIT"

        if [ "$INPUT_BRANCH" == "master" ]; then
            # --- ЛОГИКА ДЛЯ MASTER ---
            if [ "${{ inputs.source }}" == "openwrt" ]; then
                VAR_BRANCH="main"
            fi
            VAR_TARGET_RELEASE="snapshots"
            echo ">>> Master/Main branch selected. Using snapshots."

        else
            # --- ЛОГИКА ДЛЯ СТАБИЛЬНЫХ ВЕТОК ---
            echo ">>> Stable branch selected: $INPUT_BRANCH"
            BRANCH_VER="${INPUT_BRANCH#openwrt-}"          # openwrt-25.12 -> 25.12

            # Теги через git ls-remote: без лимитов API и с сортировкой по
            # ВЕРСИИ (API /tags не гарантирует порядок, v25.12.10 < v25.12.9
            # при сравнении строк). Шаблон отсекает -rc и прочие пре-релизы.
            # Аннотированный тег даёт две строки: сам тег и «тег^{}» — коммит,
            # на который он указывает; нужен именно коммит.
            TAGS_RAW=$(git ls-remote --tags "$VAR_REPO_URL" 2>/dev/null || true)
            TAG_RE="^v${BRANCH_VER//./\\.}\\.[0-9]+$"
            # tag_commit <тег> -> хеш коммита
            tag_commit() {
                local c
                c=$(printf '%s\n' "$TAGS_RAW" | awk -v r="refs/tags/$1^{}" '$2 == r {print $1}')
                [ -z "$c" ] && c=$(printf '%s\n' "$TAGS_RAW" | awk -v r="refs/tags/$1" '$2 == r {print $1}')
                printf '%s' "$c"
            }

            if [ -z "$TAGS_RAW" ]; then
                echo ">>> WARNING: git ls-remote не вернул теги (сеть?)."
            elif [ -z "$MANUAL_COMMIT" ]; then
                # Последний релиз ветки
                TAG_NAME=$(printf '%s\n' "$TAGS_RAW" | awk '{print $2}' | grep -v '\^{}$' \
                    | sed 's|refs/tags/||' | grep -E "$TAG_RE" | sort -V | tail -n1)
                if [ -n "$TAG_NAME" ]; then
                    VAR_COMMIT_HASH=$(tag_commit "$TAG_NAME")
                    VAR_TARGET_RELEASE="releases/${TAG_NAME#v}"
                    echo ">>> FOUND TAG: $TAG_NAME"
                    echo ">>> FOUND COMMIT: $VAR_COMMIT_HASH"
                else
                    echo ">>> WARNING: релизных тегов v${BRANCH_VER}.N не найдено."
                fi
            else
                # Ручной коммит: если это релизный тег — берём kmods этого
                # релиза, иначе ниже уйдём на SNAPSHOT ветки.
                echo ">>> Manual commit provided ($MANUAL_COMMIT). Ищу релизный тег на нём..."
                for t in $(printf '%s\n' "$TAGS_RAW" | awk '{print $2}' | grep -v '\^{}$' \
                        | sed 's|refs/tags/||' | grep -E "$TAG_RE" | sort -V); do
                    if [[ "$(tag_commit "$t")" == "$MANUAL_COMMIT"* ]]; then
                        VAR_TARGET_RELEASE="releases/${t#v}"
                        echo ">>> Коммит соответствует тегу $t"
                    fi
                done
                if [ -z "$VAR_TARGET_RELEASE" ]; then
                    echo ">>> Коммит не совпадает ни с одним релизным тегом."
                fi
            fi

            # Специфика ImmortalWrt: если папки релиза на сервере ещё нет
            if [ -n "$VAR_TARGET_RELEASE" ] && [ "${{ inputs.source }}" == "immortalwrt" ]; then
                # || true: при недоступном сервере curl вернул бы ошибку и
                # bash -e уронил бы шаг, а нужен переход на SNAPSHOT
                HTTP_CODE=$(curl -o /dev/null -s --max-time 20 -w "%{http_code}" "https://downloads.immortalwrt.org/$VAR_TARGET_RELEASE/targets/" || true)
                if [ "$HTTP_CODE" != "200" ]; then
                    echo ">>> Release folder not found on server. Using SNAPSHOT fallback."
                    VAR_TARGET_RELEASE=""
                fi
            fi

            # ФОЛБЭК: SNAPSHOT ветки. Зашитые номера релизов (раньше тут были
            # 25.12.5 / 24.10.8) устаревали и давали хеш ядра чужого релиза.
            if [ -z "$VAR_TARGET_RELEASE" ]; then
                VAR_TARGET_RELEASE="releases/${BRANCH_VER}-SNAPSHOT"
                echo ">>> Fallback: $VAR_TARGET_RELEASE"
            fi
        fi
        
        echo "REPO_BRANCH=$VAR_BRANCH" >> $GITHUB_ENV
        echo "TARGET_RELEASE=$VAR_TARGET_RELEASE" >> $GITHUB_ENV
        echo "AUTO_COMMIT_HASH=$VAR_COMMIT_HASH" >> $GITHUB_ENV

        # 3. Устройство
        source ./config/conf/${{ matrix.target }}
        echo "TARGET_NAME=${TARGET_NAME}" >> $GITHUB_ENV
        echo "CURRENT_MATRIX_TARGET=${{ matrix.target }}" >> $GITHUB_ENV
        echo "KERNEL_PATH=${KERNEL_PATH}" >> $GITHUB_ENV
        # Архитектура пакетов — для feeds.conf репозитория пакетов
        # (sh/feeds-from-repo.sh): releases/packages-<ветка>/<arch>/
        PKG_ARCH=$(printf '%s\n' "$DEVICE_CONFIG_COMMANDS" | sed -n 's/.*CONFIG_TARGET_ARCH_PACKAGES="\([^"]*\)".*/\1/p' | head -n1)
        echo "PKG_ARCH=${PKG_ARCH}" >> $GITHUB_ENV
        echo "DEVICE_CONFIG_COMMANDS<<EOF" >> $GITHUB_ENV
        echo "${DEVICE_CONFIG_COMMANDS}" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # --- Сводка ---------------------------------------------------------
        # Показываем то, что реально применится: в режиме combo матрица
        # задана жёстко (вариант, AGH, sing-box, ytb, zz1 и патчи — из
        # пресета, поля формы игнорируются); выбор, который вариант не
        # допускает, job setup уже привёл в соответствие (см. его лог).
        SUM_MODE="${{ inputs.target }}"
        SUM_VARIANT="${{ matrix.vname }}"
        SUM_EXCLUDE="$EXCLUDE_INPUT"

        if [ "${{ matrix.patches }}" = "true" ]; then
          SUM_PATCHES="да"
        else
          SUM_PATCHES="нет"
        fi

        if [ "$SUM_MODE" = "combo" ]; then
            SUM_VARIANT_NOTE="  (выбор Build Variant игнорируется: режим combo)"
        else
            SUM_VARIANT_NOTE=""
        fi
        SUM_SRC_NOTE=""
        [ "$SUM_MODE" = "combo" ] && SUM_SRC_NOTE="  (пресет combo)"

        case "${{ matrix.agh }}" in
            no)     SUM_AGH="нет (убирается из прошивки)" ;;
            feed)   SUM_AGH="пакет из фида" ;;
            latest) SUM_AGH="пакет из фида + свежий бинарник" ;;
            *)      SUM_AGH="${{ matrix.agh }}" ;;
        esac
        case "${{ matrix.sb }}" in
            no)   SUM_SB="нет (убирается из прошивки)" ;;
            feed) SUM_SB="пакет из фида" ;;
            tiny) SUM_SB="sing-box-tiny из фида (тонкое устройство)" ;;
            podkop-engine*) SUM_SB="пакет из фида + ${{ matrix.sb }} (бинарник, init-скрипты и failsafe)" ;;
            *)    SUM_SB="пакет из фида + бинарник ${{ matrix.sb }}" ;;
        esac
        [ "${{ matrix.ytb }}" = "true" ] && SUM_YTB="да" || SUM_YTB="нет"
        [ "${{ matrix.zz }}" = "true" ] && SUM_ZZ="да" || SUM_ZZ="нет"
        SUM_AGH="$SUM_AGH$SUM_SRC_NOTE"
        SUM_SB="$SUM_SB$SUM_SRC_NOTE"

        echo "=========================================="
        echo "       [BUILD SUMMARY]                    "
        echo "=========================================="
        echo "Режим          : $SUM_MODE"
        echo "Устройство     : ${{ matrix.target }}  ($TARGET_NAME)"
        echo "Вариант        : $SUM_VARIANT$SUM_VARIANT_NOTE"
        echo "Раннер         : ${{ inputs.runner_os }}"
        echo "------------------------------------------"
        echo "Source         : ${{ inputs.source }}"
        echo "Branch Input   : $INPUT_BRANCH"
        echo "Real Branch    : $VAR_BRANCH"
        echo "Target Release : $VAR_TARGET_RELEASE"
        echo "Target Commit  : ${VAR_COMMIT_HASH:-HEAD ветки}"
        echo "------------------------------------------"
        echo "AdGuardHome    : $SUM_AGH"
        echo "Sing-box       : $SUM_SB"
        echo "youtubeUnblock : $SUM_YTB"
        echo "zz1            : $SUM_ZZ"
        echo "Патчи          : $SUM_PATCHES"
        if [ "$SUM_PATCHES" = "да" ]; then
            [ "$PATCH_DRIFT_CHECK" = "1" ] && echo "Устаревшие     : стоп сборки + Telegram" || echo "Устаревшие     : пропуск с предупреждением"
        fi
        if [ "${{ matrix.feeds }}" = "true" ]; then
            echo "Фиды           : коммиты репозитория пакетов (packages-${VAR_BRANCH#openwrt-}/${PKG_ARCH:-?})"
        else
            echo "Фиды           : как в теге релиза"
        fi
        echo "Exclude        : ${SUM_EXCLUDE:-(нет)}"
        echo "Device config  : ./config/conf/${{ matrix.target }}"
        echo "Kernel path    : $KERNEL_PATH"
        echo "=========================================="

    - name: Init Env
      env: { DEBIAN_FRONTEND: noninteractive }
      run: |
        # Список зависимостей берём из своего репозитория, а не с чужого
        # raw.githubusercontent: внешний файл могут переименовать или удалить.
        # Файл выбирается по раннеру — в 24.04 исчезли libncurses5-dev,
        # libncursesw5, libncursesw5-dev, mkisofs и python2.7.
        DEPENDS_FILE="$GITHUB_WORKSPACE/depends-ubuntu-2404"
        if [ "${{ inputs.runner_os }}" = "ubuntu-22.04" ]; then
            DEPENDS_FILE="$GITHUB_WORKSPACE/depends-ubuntu-2204"
        fi

        if [ ! -f "$DEPENDS_FILE" ]; then
            echo "::error::Не найден файл зависимостей $DEPENDS_FILE"
            exit 1
        fi

        echo ">>> Раннер: ${{ inputs.runner_os }}"
        echo ">>> Файл зависимостей: $(basename "$DEPENDS_FILE") ($(wc -l < "$DEPENDS_FILE") пакетов)"

        # Обновляем базу пакетов
        sudo -E apt-get -qq update

        # Устанавливаем зависимости
        sudo -E apt-get -qq install $(tr '\n' ' ' < "$DEPENDS_FILE")
        
        # Настройка времени и рабочей директории
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir
        
        echo "=========================================="
        echo "       [ENV INIT SUMMARY]                 "
        echo "=========================================="
        echo "Runner         : ${{ inputs.runner_os }}"
        echo "Depends file   : $(basename "$DEPENDS_FILE")"
        echo "Workdir: /workdir"
        date
        echo "=========================================="

    - name: Clone Source
      working-directory: /workdir
      run: |
        git clone --branch $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        
        # Используем вычисленный хеш (автоматический или ручной)
        if [ -n "$AUTO_COMMIT_HASH" ]; then
           echo "Checking out specific commit: $AUTO_COMMIT_HASH"
           git checkout "$AUTO_COMMIT_HASH"
           CHECKOUT_MSG="Commit $AUTO_COMMIT_HASH"
        else
           CHECKOUT_MSG="Latest head of $REPO_BRANCH"
        fi
        
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
        echo "=========================================="
        echo "       [CLONE SUMMARY]                    "
        echo "=========================================="
        echo "Repo cloned: $REPO_URL"
        echo "Branch: $REPO_BRANCH"
        echo "Status: $CHECKOUT_MSG"
        echo "Current Head:"
        git log -1 --format="%H - %s"
        echo "=========================================="

    - name: Apply custom patches
      run: |
        APPLY_PATCHES="${{ matrix.patches }}"
        PATCH_STATUS="No patches dir"

        if [ "$APPLY_PATCHES" != "true" ]; then
          echo ">>> Custom patches DISABLED by matrix."
          echo ">>> Direct OpenWrt patches are skipped here."
          echo ">>> Feed/package patch sources will also be hidden before WRT-part2.sh/WRT-part3.sh."
          PATCH_STATUS="Disabled by matrix (all patches skipped)"
        elif [ -d "$GITHUB_WORKSPACE/patches" ]; then
          # Обычные патчи к дереву OpenWrt находятся только
          # непосредственно в patches/*.patch.
          # Патчи feeds/packages обрабатываются отдельно
          # WRT-part2.sh и WRT-part3.sh.
          files=()
          shopt -s nullglob
          files=( "$GITHUB_WORKSPACE"/patches/*.patch )
          shopt -u nullglob

          if [ ${#files[@]} -gt 0 ]; then
            for p in "${files[@]}"; do
              echo "Applying patch: $p"
              patch -p1 -d openwrt < "$p" || { echo "Patch failed: $p"; exit 1; }
            done
            PATCH_STATUS="Applied ${#files[@]} OpenWrt patches"
          else
            echo "No direct OpenWrt patches found in patches/ (feed/package patches are handled later)."
            PATCH_STATUS="No direct OpenWrt patches"
          fi
        else
          echo "Patches directory not found. Skipping."
        fi

        echo "=========================================="
        echo "       [PATCH SUMMARY]                    "
        echo "=========================================="
        echo "Apply patches: $APPLY_PATCHES"
        echo "Result: $PATCH_STATUS"
        echo "=========================================="

    - name: Update Feeds & Config
      env:
        EXCLUDE_INPUT: ${{ inputs.exclude_keywords }}
      run: |
        cd openwrt

        export VARIANT="${{ matrix.variant }}"
        export CURRENT_MATRIX_TARGET="${{ matrix.target }}"
        # Выбор компонентов для part2/part3 (значения уже согласованы в setup)
        export AGH_MODE="${{ matrix.agh }}"
        export SB_MODE="${{ matrix.sb }}"
        export YTB="${{ matrix.ytb }}"
        export ZZ="${{ matrix.zz }}"
        echo ">>> Выбран: Variant=$VARIANT, Target=$CURRENT_MATRIX_TARGET, agh=$AGH_MODE, sb=$SB_MODE, ytb=$YTB, zz=$ZZ"

        mkdir -p files/etc
        date +'%Y-%m-%d' > files/etc/build_date
        
        # 1. Запуск Part 1 (Добавление репозиториев)
        chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
        $GITHUB_WORKSPACE/$DIY_P1_SH
        
        VARIANT="${{ matrix.variant }}"
        echo "Variant selected: $VARIANT"
        
        # Добавление фидов в зависимости от варианта
        if [ "$VARIANT" == "passwall" ]; then
            # echo -e "\nsrc-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git" >> feeds.conf.default
            echo -e "\nsrc-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git" >> feeds.conf.default
            # echo -e "\nsrc-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
            echo -e "\nsrc-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
        elif [ "$VARIANT" == "xray" ]; then
            echo -e "\nsrc-git luciappxray https://github.com/yichya/luci-app-xray.git" >> feeds.conf.default
        elif [ "$VARIANT" == "podkop" ]; then
            echo -e "\nsrc-git podkop https://github.com/itdoginfo/podkop.git;main" >> feeds.conf.default
        elif [ "$VARIANT" == "netshift" ]; then
            # Адрес — NETSHIFT_FEED в env; патчи — patches/feeds/netshift (part2).
            echo ">>> netshift: фид $NETSHIFT_FEED"
            echo -e "\nsrc-git $NETSHIFT_FEED" >> feeds.conf.default
        elif [ "$VARIANT" == "forkop" ]; then
            # Фид выбран полем формы: forkop — оригинал (FORKOP_FEED_ORIG),
            # forkop-mod — форк (FORKOP_FEED_MOD); адреса — в env в начале
            # файла. Патчи фида — patches/feeds/<имя фида>, их применяет
            # WRT-part2.sh.
            if [ "${{ matrix.fk }}" = "forkopmod" ]; then
                FORKOP_FEED="$FORKOP_FEED_MOD"
            else
                FORKOP_FEED="$FORKOP_FEED_ORIG"
            fi
            FK_NAME="${FORKOP_FEED%% *}"
            echo ">>> forkop: фид $FORKOP_FEED"
            echo -e "\nsrc-git $FORKOP_FEED" >> feeds.conf.default
            if [ "${{ matrix.patches }}" != "true" ]; then
                echo "::warning title=forkop без патчей::Фид ${FK_NAME} собирается без patches/feeds/${FK_NAME} (подробности — в предупреждении job setup)."
            elif ! ls "$GITHUB_WORKSPACE/patches/feeds/${FK_NAME}"/*.patch >/dev/null 2>&1; then
                echo "::warning title=forkop: нет патчей для фида::Для фида ${FK_NAME} нет patches/feeds/${FK_NAME}/*.patch — пакет соберётся без исправлений."
            fi
        elif [ "$VARIANT" == "trafira" ]; then
            # Адрес — TRAFIRA_FEED в env; патчи — patches/feeds/trafira (part2).
            echo ">>> trafira: фид $TRAFIRA_FEED"
            echo -e "\nsrc-git $TRAFIRA_FEED" >> feeds.conf.default
        fi

        # --- ЗАМЕНА ЗЕРКАЛ (FIX 503 ERROR) Меняем git.openwrt.org на github.com---
        sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|g' feeds.conf.default
        # -------------------------------------

        # Фиды packages/luci/routing/telephony/video на коммитах репозитория
        # пакетов ветки (поле feeds матрицы: форма feeds_latest или пресет combo). После замены зеркал: коммит
        # проверяется на том адресе, откуда его возьмёт feeds update.
        cp feeds.conf.default /tmp/feeds.conf.tag
        if [ "${{ matrix.feeds }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/sh/feeds-from-repo.sh"
        fi
        echo ">>> feeds.conf.default:"
        cat feeds.conf.default
        
        ./scripts/feeds update -a

        # /etc/build_feeds в прошивке. Первая строка — откуда основные фиды:
        # repo, если sh/feeds-from-repo.sh заменил хотя бы один коммит, иначе
        # tag (галочка могла быть включена, но тег оказался новее сборки
        # пакетов). Её показывает баннер zz1. Дальше — строки feeds.conf с
        # коммитами, которые feeds update реально скачал (у фидов на ветке —
        # её голова на момент сборки); файл годится как feeds.conf для
        # повторной сборки на тех же исходниках. Патчи из patches/ меняют
        # рабочие копии фидов позже и здесь не отражаются.
        {
            if cmp -s /tmp/feeds.conf.tag feeds.conf.default; then echo "tag"; else echo "repo"; fi
            grep -E '^src-git(-full)?[[:space:]]' feeds.conf.default | while read -r f_type f_name f_spec _; do
                # Только собственный клон фида: иначе git нашёл бы репозиторий
                # самого OpenWrt (feeds/ лежит внутри него).
                f_head=""
                [ -e "feeds/$f_name/.git" ] && f_head=$(git -C "feeds/$f_name" rev-parse HEAD 2>/dev/null)
                if [ -n "$f_head" ]; then
                    echo "$f_type $f_name ${f_spec%%[;^]*}^$f_head"
                else
                    echo "$f_type $f_name $f_spec"
                fi
            done
        } > files/etc/build_feeds
        echo ">>> /etc/build_feeds:"
        cat files/etc/build_feeds

        # -------------------------------------------------------------
        # Глобальный переключатель патчей для Part 2 / Part 3.
        # Папку patches скрываем после feeds update (раньше в этой точке
        # по ней выбирался фид forkop; скрывать до неё смысла нет).
        # Благодаря trap каталог вернётся даже при ошибке Part 2/3.
        # -------------------------------------------------------------
        PATCHES_BACKUP=""
        restore_patches() {
            if [ -n "${PATCHES_BACKUP:-}" ] && [ -d "$PATCHES_BACKUP" ]; then
                if [ ! -e "$GITHUB_WORKSPACE/patches" ]; then
                    mv "$PATCHES_BACKUP" "$GITHUB_WORKSPACE/patches"
                    rmdir "$(dirname "$PATCHES_BACKUP")" 2>/dev/null || true
                    echo ">>> [Patches] Оригинальный каталог patches восстановлен."
                else
                    echo "::warning::Не удалось восстановить patches: целевой каталог уже существует."
                fi
            fi
        }
        trap restore_patches EXIT

        if [ "${{ matrix.patches }}" != "true" ] && [ -d "$GITHUB_WORKSPACE/patches" ]; then
            PATCHES_TMP_DIR="$(mktemp -d)"
            PATCHES_BACKUP="$PATCHES_TMP_DIR/patches"
            mv "$GITHUB_WORKSPACE/patches" "$PATCHES_BACKUP"
            echo ">>> [Patches] DISABLED: patches/ временно скрыт для WRT-part2.sh и WRT-part3.sh."
        fi

        # 2. Запуск Part 2 (Фиксы версий и Python - строго между update и install)
        if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
            chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
            $GITHUB_WORKSPACE/$DIY_P2_SH
        fi

        ./scripts/feeds install -a
        
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE ./.config
        # Нормализация DOS-переводов строк: WRT.config может прийти в CRLF (загрузка
        # через веб-интерфейс GitHub обходит .gitattributes), а .config дальше
        # дополняется LF-строками (device-конфиги, part3) -> убираем \r у базы,
        # чтобы не было mix CRLF/LF и проблем в kconfig/grep с якорем $.
        [ -f ./.config ] && sed -i 's/\r$//' ./.config
        [ -e $GITHUB_WORKSPACE/files ] && cp -r $GITHUB_WORKSPACE/files ./
        
        eval "$DEVICE_CONFIG_COMMANDS"
        
        # 3. Запуск Part 3 (Замена пакетов, очистка, клонирование доп. софта)
        # Выполняется ПОСЛЕ install, чтобы перезаписать ссылки.
        # Если патчи отключены, patches/ всё ещё скрыт, поэтому
        # apply_package_patches в WRT-part3.sh ничего не применит.
        if [ -f "$GITHUB_WORKSPACE/$DIY_P3_SH" ]; then
            chmod +x $GITHUB_WORKSPACE/$DIY_P3_SH
            $GITHUB_WORKSPACE/$DIY_P3_SH
        fi

        # Патчи, файлы которых изменились у автора (part2 и part3 собирают их
        # в patch_drift.txt, а не останавливаются на первом — так в отчёт
        # попадают все). Компилировать с ними нельзя: патч не применён, а
        # прошивка без исправления — не та, что ждёшь. Уведомление — в
        # следующем шаге.
        if [ -s "$GITHUB_WORKSPACE/patch_drift.txt" ]; then
            echo "::error title=Патчи надо обновить::Сборка остановлена до компиляции: у авторов изменились файлы, к которым применяются патчи (список ниже и в Telegram)"
            sed 's/^/    /' "$GITHUB_WORKSPACE/patch_drift.txt"
            exit 1
        fi
        
        # === ОПТИМИЗАЦИЯ РАЗМЕРА СБОРКИ ===
        # Критично для OpenWrt + Passwall
        # echo ">>> Optimizing build config to save disk space..."
        # echo 'CONFIG_CCACHE=n' >> ./.config
        # echo 'CONFIG_KERNEL_DEBUG_INFO=n' >> ./.config
        # echo 'CONFIG_DEBUG_INFO=n' >> ./.config
        # =================================
        
        # --- ФИНАЛЬНАЯ НАСТРОЙКА .CONFIG ---
        
        # ВАЖНОЕ ИСПРАВЛЕНИЕ:
        # Удаляем HomeProxy и Sing-Box только если выбран "тяжелый" вариант (Passwall/Xray/V2rayA).
        if [[ "$VARIANT" == "passwall" || "$VARIANT" == "v2raya" || "$VARIANT" == "xray" ]]; then
            echo ">>> Removing HomeProxy and Sing-box dependencies for $VARIANT compatibility..."
            sed -i '/homeproxy/d' ./.config
            sed -i '/sing-box/Id' ./.config
        fi
        
        if [[ "$VARIANT" == "podkop" || "$VARIANT" == "netshift" || "$VARIANT" == "forkop" || "$VARIANT" == "trafira" || "$VARIANT" == "rehomeproxy" ]]; then
            # rehomeproxy: luci-app-re-homeproxy ставит файлы по тем же путям,
            # что luci-app-homeproxy, вместе их ставить нельзя. Его строки
            # добавляются ниже, уже после этой чистки.
            echo ">>> Removing HomeProxy for $VARIANT compatibility..."
            sed -i '/homeproxy/d' ./.config
        fi
        
        if [ "$VARIANT" == "passwall" ]; then
            # Очищаем любые упоминания shadowsocks перед настройкой, чтобы не было конфликтов
            sed -i '/[Ss][Hh][Aa][Dd][Oo][Ww][Ss][Oo][Cc][Kk][Ss]/d' ./.config
            # N
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy=n' >> ./.config
            # echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_NaiveProxy=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Libev_Client=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Libev_Server=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_tuic_client=n' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=n' >> ./.config
            # Y
            echo 'CONFIG_PACKAGE_luci-app-passwall2=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_IPv6_Nat=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin=y' >> ./.config
            echo 'CONFIG_PACKAGE_xray-core=y' >> ./.config
            echo 'CONFIG_PACKAGE_geoview=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-plugin=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-geoip=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-geosite=y' >> ./.config
            
        elif [ "$VARIANT" == "v2raya" ]; then
            echo 'CONFIG_PACKAGE_xray-core=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2rayA=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-geoip=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-geosite=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-v2raya-ru=y' >> ./.config
            
        elif [ "$VARIANT" == "xray" ]; then
            echo 'CONFIG_PACKAGE_luci-app-xray=y' >> ./.config
            echo 'CONFIG_PACKAGE_xray-core=y' >> ./.config
            # geoip.dat / geosite.dat в /usr/share/xray: без них luci-app-xray
            # молча отбрасывает все правила geoip:/geosite: (GeoIP Direct,
            # Bypassed/Forwarded domain rules) и шлёт в прокси всё подряд.
            # Пакета «v2ray-geodata» нет — это лишь виртуальное PROVIDES
            # пакетов v2ray-geoip и v2ray-geosite, строка с ним в .config
            # ничего не включала. geoview (фид passwall_packages) xray не нужен.
            echo 'CONFIG_PACKAGE_v2ray-geoip=y' >> ./.config
            echo 'CONFIG_PACKAGE_v2ray-geosite=y' >> ./.config
        
        elif [ "$VARIANT" == "podkop" ]; then
            echo 'CONFIG_PACKAGE_podkop=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-podkop=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-podkop-ru=y' >> ./.config

        elif [ "$VARIANT" == "netshift" ]; then
            # Зависимости (sing-box, curl, jq, kmod-nft-tproxy, coreutils-base64,
            # bind-dig) уже в WRT.config; https-dns-proxy, nextdns и passwall,
            # с которыми пакет конфликтует, там не включены.
            echo 'CONFIG_PACKAGE_netshift=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-netshift=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-netshift-ru=y' >> ./.config

        elif [ "$VARIANT" == "forkop" ]; then
            echo 'CONFIG_PACKAGE_forkop=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-forkop=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-forkop-ru=y' >> ./.config

        elif [ "$VARIANT" == "trafira" ]; then
            # Все зависимости trafira (kmod-tun, kmod-nft-tproxy, kmod-inet-diag,
            # bind-dig, coreutils-base64, ucode-mod-uci ...) уже есть в
            # WRT.config; конфликтующих (https-dns-proxy, nextdns, podkop,
            # passwall) там нет. sing-box ставит part3/фид, как для forkop.
            echo 'CONFIG_PACKAGE_trafira=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-app-trafira=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-trafira-ru=y' >> ./.config

        elif [ "$VARIANT" == "rehomeproxy" ]; then
            # Пакет клонирует WRT-part3.sh в package/luci-app-re-homeproxy.
            # kmod-nft-tproxy, kmod-tun, kmod-nft-queue (Zapret), ucode-mod-digest
            # и curl уже включены в WRT.config: в Makefile форка их нет, его
            # установщик докачивает их на роутере, а здесь они встроены в образ.
            echo 'CONFIG_PACKAGE_luci-app-re-homeproxy=y' >> ./.config
            echo 'CONFIG_PACKAGE_luci-i18n-re-homeproxy-ru=y' >> ./.config
        
        fi
        
        # =======================================================
        # ЛОГИКА ИСКЛЮЧЕНИЯ ПАКЕТОВ (EXCLUDE KEYWORDS)
        # =======================================================
        # EXCLUDE_INPUT приходит через env шага. Слово ищется как ПОДСТРОКА
        # имени пакета без учёта регистра (awk index, не регулярка), поэтому
        # символы вроде . | / * в слове не ломают поиск.
        if [ -n "$EXCLUDE_INPUT" ]; then
            echo ">>> [EXCLUDE] Processing keywords: $EXCLUDE_INPUT"
            read -ra EXCLUDE_WORDS <<< "$EXCLUDE_INPUT"
            for WORD in "${EXCLUDE_WORDS[@]}"; do
                echo "   > Searching for enabled packages containing '$WORD'..."
                # Только включенные (=y) пакеты; жестко отключаем, чтобы не собрались
                awk -v w="$WORD" '
                    BEGIN { w = tolower(w) }
                    /^CONFIG_PACKAGE_[^=]*=y$/ {
                        name = substr($0, 1, index($0, "=") - 1)
                        if (index(tolower(substr(name, 16)), w)) {
                            print "      - Disabling: " name > "/dev/stderr"
                            print "# " name " is not set"
                            next
                        }
                    }
                    { print }
                ' .config > .config.exclude && mv .config.exclude .config
            done
            echo ">>> [EXCLUDE] Done."
        fi
        # =======================================================
             
        make defconfig
        
        echo "=========================================="
        echo "       [CONFIG SUMMARY]                   "
        echo "=========================================="
        echo "Variant selected: $VARIANT"
        echo "Checking key packages in .config:"
        # Проверяем наличие ключевых пакетов для уверенности
        grep -E "CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|luci-app-passwall2|luci-app-v2raya|luci-app-xray|xray-core|v2ray-geoip|v2ray-geosite|luci-app-podkop|luci-app-netshift|luci-app-forkop|luci-app-trafira|luci-app-re-homeproxy)=" .config || echo "None found"
        echo "=========================================="

    - name: Telegram — патчи надо обновить
      # Только для сборки, которую остановила сверка патчей (patch_drift.txt
      # пишут part2/part3). Остальные сборки матрицы продолжаются
      # (fail-fast: false); общий итог запуска придёт как обычно.
      if: failure() && hashFiles('patch_drift.txt') != ''
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BUILD_NAME: ${{ inputs.source }} ${{ inputs.branch }} · ${{ matrix.vname }} · ${{ matrix.target }}
      run: |
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
          echo "::notice::Секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы — уведомление пропущено."
          exit 0
        fi
        esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
        # Telegram принимает до 4096 символов: не больше 15 строк по 180
        # символов (sed в UTF-8 режет по символам, не по байтам — иначе
        # разрезанная буква сделала бы текст невалидным для Telegram)
        TOTAL=$(grep -c . "$GITHUB_WORKSPACE/patch_drift.txt")
        LIST=$(head -n 15 "$GITHUB_WORKSPACE/patch_drift.txt" | LC_ALL=C.UTF-8 sed -E 's/^(.{180}).+$/\1…/; s/^/• /')
        if [ "$TOTAL" -gt 15 ]; then
          LIST=$(printf '%s\n… и ещё %s — полный список в журнале сборки' "$LIST" "$((TOTAL - 15))")
        fi
        {
          printf '<b>⛔ Патчи надо обновить</b>\n'
          printf '%s\n\n' "$BUILD_NAME" | esc
          printf 'Сборка остановлена до компиляции: у авторов изменились файлы, к которым применяются эти патчи. Остальные сборки запуска продолжаются.\n\n'
          printf '%s\n\n' "$LIST" | esc
          printf '<a href="%s">Открыть запуск</a>' "$RUN_URL"
        } > /tmp/tg_drift.txt
        HTTP=$(curl -sS -o /tmp/tg.json -w '%{http_code}' --max-time 20 \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT}" \
          --data-urlencode "text=$(cat /tmp/tg_drift.txt)" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_web_page_preview=true" 2>/dev/null) || HTTP="000"
        if [ "$HTTP" = "200" ]; then
          echo ">>> Уведомление в Telegram отправлено."
        else
          echo "::warning::Telegram API ответил HTTP $HTTP: $(jq -r '.description // "нет ответа"' /tmp/tg.json 2>/dev/null)"
        fi
        rm -f /tmp/tg.json /tmp/tg_drift.txt

    - name: Check sing-box compatibility (homeproxy)
      # Проверяем ФАКТИЧЕСКУЮ совместимость, а не номер версии: генератор
      # homeproxy, который едет в прошивку, против sing-box, который едет в
      # прошивку (скачанный либо из фида). Номер версии нигде не зашит: если
      # immortalwrt обновит генератор под новые sing-box, проверка сама начнёт
      # пропускать — править yml не придётся. И наоборот: если новый sing-box
      # удалит ещё какое-то поле, которое пишет генератор, сборка упадёт здесь.
      # Шаг стоит ДО компиляции: падение здесь экономит ~1.5 часа и не даёт
      # собрать прошивку, в которой прокси не стартует.
      if: matrix.variant == 'homeproxy'
      run: |
        cd openwrt

        # --- 1. Генератор homeproxy, который попадёт в прошивку ---
        # Сначала клон из part3 (package/), затем встроенный в фид ImmortalWrt LuCI.
        GEN=""
        for base in package feeds; do
            GEN=$(find "$base" -path '*luci-app-homeproxy/root/etc/homeproxy/scripts/generate_client.uc' 2>/dev/null | head -n 1)
            [ -n "$GEN" ] && break
        done
        if [ -z "$GEN" ]; then
            echo "::warning title=Проверка sing-box пропущена::Генератор homeproxy не найден в package/ и feeds/"
            exit 0
        fi

        # --- 2. Версия sing-box, которая попадёт в прошивку ---
        # files/usr/bin/sing-box перекрывает пакетный бинарник. part3 может его
        # удалить (slateax/ax59u → sing-box-tiny), поэтому смотрим на файл, а не
        # только на переменную из шага загрузки.
        if [ -f files/usr/bin/sing-box ] && [ -n "$SB_DOWNLOADED_TAG" ]; then
            SB_SRC="загружен: ${SB_DOWNLOADED_REPO} ${SB_DOWNLOADED_TAG}"
            SB_VER="${SB_DOWNLOADED_TAG#v}"
            SB_VER="${SB_VER%%-*}"        # v1.14.1-extended-2.7.2 → 1.14.1
        else
            # sing-box-tiny собирается из того же Makefile, версия общая
            FEED_MK=$(find feeds -path '*/net/sing-box/Makefile' 2>/dev/null | head -n 1)
            SB_VER=$(grep -m1 '^PKG_VERSION' "$FEED_MK" 2>/dev/null | cut -d= -f2 | tr -d ' ')
            SB_SRC="пакет из фида: ${FEED_MK:-не найден}"
        fi
        # Тонкие устройства (part3: slateax/ax59u) получают sing-box-tiny из
        # фида; скачанный бинарник им не ставится, выбор формы не поможет
        SB_TINY=0
        if [ ! -f files/usr/bin/sing-box ] && grep -q '^CONFIG_PACKAGE_sing-box-tiny=y' .config; then
            SB_TINY=1
            SB_SRC="$SB_SRC, sing-box-tiny"
        fi
        if [ -z "$SB_VER" ]; then
            echo "::warning title=Проверка sing-box пропущена::Не удалось определить версию sing-box в прошивке"
            exit 0
        fi

        # --- 3. sing-box той же версии под архитектуру раннера ---
        # Бинарник для роутера (arm64) на раннере не запустить, берём amd64
        # той же версии: разбор конфига у них одинаковый.
        PROBE_DIR=$(mktemp -d)
        PROBE_URL="https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
        if ! curl -fsSL --retry 3 -o "$PROBE_DIR/sb.tgz" "$PROBE_URL"; then
            echo "::warning title=Проверка sing-box пропущена::Не удалось скачать sing-box ${SB_VER} (amd64): $PROBE_URL"
            exit 0
        fi
        tar -xzf "$PROBE_DIR/sb.tgz" -C "$PROBE_DIR"
        SB_BIN=$(find "$PROBE_DIR" -type f -name sing-box | head -n 1)

        # --- 4. Пробный конфиг из того, что РЕАЛЬНО пишет генератор ---
        # Каждый маркер — возможность, которую sing-box объявлял устаревшей.
        # Новый маркер добавляется одной строкой grep и одной веткой в jq.
        has() { grep -Eq -- "$1" "$GEN" && echo 1 || echo 0; }
        M_SNIFF=$(has '^[[:space:]]*sniff(_override_destination)?:')  # legacy inbound fields (удалены в 1.13)
        M_BLOCK=$(has "type: 'block'")                                 # legacy special outbound
        M_RDRC=$(has 'store_rdrc')                                     # cache_file.store_rdrc (устарел в 1.14)
        M_INDEP=$(has 'independent_cache')                             # dns.independent_cache (устарел в 1.14)

        # Генератор, который сам выбирает форму sniff по версии ядра
        # (patches/packages/luci-app-homeproxy/004-*): legacy-поля пишутся
        # только для sing-box < 1.13, иначе — правило action 'sniff'.
        # Признаки проверяются все сразу: поля входящих подключений зависят от
        # legacy_inbound_sniff, правило sniff есть, версия читается из ядра.
        # Тогда для 1.13+ legacy-поля в пробу не попадают. Если патч не
        # применился или его формат другой — остаётся строгая проверка выше.
        SNIFF_MODE="статически"
        if [ "$M_SNIFF" = "1" ] &&
           grep -q 'sniff: legacy_inbound_sniff' "$GEN" &&
           grep -q "action: 'sniff'" "$GEN" &&
           grep -q "sing-box version" "$GEN"; then
            case "$SB_VER" in
                0.*|1.[0-9]|1.[0-9].*|1.1[0-2]|1.1[0-2].*) SNIFF_MODE="по версии: legacy-поля (sing-box < 1.13)" ;;
                *) M_SNIFF=0; SNIFF_MODE="по версии: правило sniff (sing-box ≥ 1.13)" ;;
            esac
        fi

        # То же для опций кэша DNS (patches/packages/luci-app-homeproxy/006-*):
        # store_rdrc и independent_cache пишутся только для sing-box < 1.14,
        # с 1.14 — store_dns. Тогда для 1.14+ их нет и в пробе.
        CACHE_MODE="статически"
        if grep -q 'independent_cache: legacy_dns_cache' "$GEN" &&
           grep -q 'store_rdrc: legacy_dns_cache' "$GEN" &&
           grep -q 'store_dns: modern_dns_cache' "$GEN"; then
            case "$SB_VER" in
                0.*|1.[0-9]|1.[0-9].*|1.1[0-3]|1.1[0-3].*) CACHE_MODE="по версии: store_rdrc/independent_cache (sing-box < 1.14)" ;;
                *) M_RDRC=0; M_INDEP=0; CACHE_MODE="по версии: store_dns (sing-box ≥ 1.14)" ;;
            esac
        fi

        jq -n --argjson s "$M_SNIFF" --argjson b "$M_BLOCK" --argjson r "$M_RDRC" --argjson i "$M_INDEP" '
        {
          log: {level: "warn"},
          dns: ({servers: [{tag: "default-dns", type: "udp", server: "127.0.0.1"}], final: "default-dns"}
                + (if $i == 1 then {independent_cache: true} else {} end)),
          inbounds: [({type: "mixed", tag: "mixed-in", listen: "127.0.0.1", listen_port: 15330}
                + (if $s == 1 then {sniff: true, sniff_override_destination: true} else {} end))],
          outbounds: ([{type: "direct", tag: "direct-out"}]
                + (if $b == 1 then [{type: "block", tag: "block-out"}] else [] end)),
          route: {default_domain_resolver: {server: "default-dns"}, final: "direct-out"},
          experimental: {cache_file: ({enabled: true, path: "/tmp/sb-probe-cache.db"}
                + (if $r == 1 then {store_rdrc: true} else {} end))}
        }' > "$PROBE_DIR/probe.json"

        # --- 5. Вердикт самого sing-box ---
        RC=0
        "$SB_BIN" check -c "$PROBE_DIR/probe.json" > "$PROBE_DIR/out.txt" 2>&1 || RC=$?
        OUT=$(sed 's/\x1b\[[0-9;]*m//g' "$PROBE_DIR/out.txt")

        echo "=========================================="
        echo "   [SING-BOX COMPATIBILITY CHECK]         "
        echo "=========================================="
        echo "Генератор      : $GEN"
        echo "sing-box       : $SB_VER ($SB_SRC)"
        echo "Маркеры        : sniff=$M_SNIFF block=$M_BLOCK store_rdrc=$M_RDRC independent_cache=$M_INDEP"
        echo "sniff в генер. : $SNIFF_MODE"
        echo "Кэш DNS в ген. : $CACHE_MODE"
        echo "------------------------------------------"
        echo "${OUT:-(замечаний нет)}"
        echo "=========================================="

        # Предупреждения об устаревании — в аннотации: видно заранее,
        # что сломается при переходе на следующую версию sing-box.
        echo "$OUT" | grep 'WARN' | sed 's/^WARN\[[0-9]*\] //' | while IFS= read -r w; do
            echo "::warning title=sing-box ${SB_VER}: устаревшее поле в homeproxy::$w"
        done

        rm -rf "$PROBE_DIR"

        if [ "$RC" -ne 0 ]; then
            FATAL_MSG=$(echo "$OUT" | grep -m1 'FATAL' | sed 's/^FATAL\[[0-9]*\] //; s/^decode config at [^:]*: //')
            echo "::error title=homeproxy несовместим с sing-box ${SB_VER}::${FATAL_MSG}"
            echo ""
            echo ">>> Генератор homeproxy пишет поля, которые sing-box ${SB_VER} не принимает."
            echo ">>> Прошивка собралась бы, но прокси на роутере не запустился бы."
            if [ "$SB_TINY" = "1" ]; then
                echo ">>> ${{ matrix.target }} использует sing-box-tiny из фида: поле sb"
                echo ">>> на него не влияет (part3 удаляет скачанный бинарник ради размера)."
                echo ">>> Варианты: собрать это устройство в варианте без homeproxy либо"
                echo ">>> дождаться обновления homeproxy в immortalwrt или sing-box в фиде."
            else
                echo ">>> Выбери в поле sb версию, которую проверка пропускает,"
                echo ">>> либо дождись обновления homeproxy в immortalwrt."
            fi
            if [ "${{ matrix.patches }}" != "true" ]; then
                echo ">>> Патчи для этой сборки отключены (patches=false). Поддержку"
                echo ">>> sing-box 1.13+ даёт patches/packages/luci-app-homeproxy/004-*:"
                echo ">>> включи патчи (apply_patches / поле patches в combo) или выбери 1.12.x."
            fi
            exit 1
        fi
        echo ">>> OK: homeproxy совместим с sing-box ${SB_VER}"

    - name: Kernel Hash
      run: |
        cd openwrt
        # 1. Определяем домен
        if [[ "$REPO_URL" == *"immortalwrt"* ]]; then
            # DOMAIN="downloads.immortalwrt.org"
            DOMAIN="immortalwrt.kyarucloud.moe"
        else
            DOMAIN="downloads.openwrt.org"
        fi
        
        # 2. Формируем основную ссылку
        FULL_URL="https://$DOMAIN/$TARGET_RELEASE/targets/$KERNEL_PATH/kmods/"
        echo ">>> [Primary] Checking Kernel at: $FULL_URL"
        
        # 3. Пробуем получить список (с защитой от 404)
        KERNEL_LIST=$(curl -sf "$FULL_URL" | grep -oE '6\.[0-9]+\.[0-9]+-[0-9]+-[a-f0-9]+' || true)
        
        # 4. Логика FALLBACK (Если по основной ссылке пусто)
        if [ -z "$KERNEL_LIST" ]; then
             echo ">>> Warning: Primary URL failed or empty."
             
             # Если это не master/main
             if [[ "$REPO_BRANCH" != "main" && "$REPO_BRANCH" != "master" ]]; then
                 VERSION_NUM="${REPO_BRANCH#openwrt-}"
                 
                 # Формируем ссылку на SNAPSHOT этой ветки
                 FALLBACK_URL="https://$DOMAIN/releases/${VERSION_NUM}-SNAPSHOT/targets/$KERNEL_PATH/kmods/"
                 
                 echo ">>> [Fallback] Trying Snapshot URL: $FALLBACK_URL"
                 
                 KERNEL_LIST=$(curl -sf "$FALLBACK_URL" | grep -oE '6\.[0-9]+\.[0-9]+-[0-9]+-[a-f0-9]+' || true)
                 
                 if [ -n "$KERNEL_LIST" ]; then
                    FULL_URL="$FALLBACK_URL"
                    echo ">>> [Fallback] Success! Using Snapshot kmods."
                 fi
             fi
        fi

        # 5. Резервная проверка на ядро не 6.x
        if [ -z "$KERNEL_LIST" ]; then
             echo ">>> Warning: Kernel 6.x pattern not found. Trying generic pattern..."
             KERNEL_LIST=$(curl -sf "$FULL_URL" | grep -oE '[0-9]\.[0-9]+\.[0-9]+-[0-9]+-[a-f0-9]+' || true)
        fi

        # 6. Парсинг и выбор последнего хеша
        LATEST_HASH=$(echo "$KERNEL_LIST" | while read -r line; do
            version=$(echo "$line" | cut -d'-' -f1)
            major=$(echo "$version" | cut -d'.' -f1)
            minor=$(echo "$version" | cut -d'.' -f2)
            patch=$(echo "$version" | cut -d'.' -f3)
            printf "%03d%03d%03d %s\n" "$major" "$minor" "$patch" "$line"
        done | sort -r | head -n1 | cut -d' ' -f2 | cut -d'-' -f3)
        
        # 7. ИТОГОВАЯ ПРОВЕРКА И ПРИМЕНЕНИЕ
        if [ -z "$LATEST_HASH" ]; then
            # === ЕСЛИ ХЕШ НЕ НАЙДЕН ===
            echo ">>> WARNING: Failed to retrieve official kernel hash."
            echo ">>> Continuing with LOCAL kernel hash generation (OpenWrt behavior)."
            echo ">>> NOTE: Official kmods from repositories will NOT work with this build."
            LATEST_HASH="LOCAL (Calculated during build)"
            # Мы НЕ выполняем команду sed, оставляя $(MKHASH) md5 в Makefile
        else
            # === ЕСЛИ ХЕШ НАЙДЕН ===
            echo ">>> Found Official Hash: ${LATEST_HASH}"
            echo ">>> Applying hash to kernel-defaults.mk..."
            sed -i "s/\$(MKHASH) md5/echo \"${LATEST_HASH}\"/g" include/kernel-defaults.mk
        fi
        
        echo "=========================================="
        echo "       [KERNEL HASH SUMMARY]              "
        echo "=========================================="
        echo "Download Domain : $DOMAIN"
        echo "Final URL       : $FULL_URL"
        echo "Applied Hash    : $LATEST_HASH"
        echo "=========================================="
    
    - name: Download sources
      run: |
        cd openwrt
        # Исходники качаются отдельно и с повторами: при сбое зеркала
        # sources.cdn.openwrt.org OpenWrt собирает архив из git сам, а такой
        # архив (*.tar.zst) часто не совпадает по хешу — так падала сборка на
        # luarocks (его тянет luaposix для internet-detector). Хуже того,
        # scripts/download.pl при неверном хеше уже скачанного файла
        # завершается раньше, чем удаляет его, и зеркала больше не пробует.
        # Поэтому после неудачной попытки такие файлы удаляются из dl/ и
        # загрузка повторяется.
        for try in 1 2 3; do
            echo ">>> make download, попытка $try"
            if make -k download -j8 > download.log 2>&1; then
                echo ">>> Исходники скачаны."
                exit 0
            fi
            make -k download -j1 V=s >> download.log 2>&1 || true
            bad=$(sed -n -e 's/.*Hash of the local file \([^ ]*\) does not match.*/\1/p' \
                -e 's/.*Hash mismatch for file \([^:]*\):.*/\1/p' download.log | sort -u)
            for f in $bad; do
                echo ">>> Неверный хеш: $f — удаляю из dl/"
                rm -f "dl/$f"
            done
            # недокачанные файлы нулевой длины
            find dl -maxdepth 1 -type f -size 0 -print -delete
            [ "$try" -lt 3 ] && sleep 60
        done
        echo "::error title=Не скачаны исходники::$(grep -o 'ERROR: [^ ]* failed to download' download.log | sort -u | tr '\n' ' ')"
        tail -n 60 download.log
        mkdir -p bin && cp download.log bin/download_failure.log
        exit 1

    - name: Compile
      run: |
        cd openwrt
        echo ">>> Running multi-thread compilation..."
        
        # 1. Попытка многопоточной сборки (быстро)
        if make -j$(expr $(nproc) + 1); then
            echo ">>> Compilation successful!"
        else
            echo ">>> Multi-thread compilation failed."
            echo ">>> Retrying with single-thread to catch the error (logging to file)..."
            
            # 2. Попытка однопоточной сборки с записью в файл build.log
            # Мы НЕ выводим это на экран, чтобы не переполнить лог GitHub
            make -j1 V=s > build.log 2>&1 || {
                echo ">>> Single-thread compilation failed!"
                echo ">>> Showing last 200 lines of build.log:"
                echo "========================================="
                tail -n 200 build.log
                echo "========================================="
                # Сохраняем лог как артефакт, чтобы можно было скачать, если 200 строк мало
                # (Хак: перемещаем его в bin, чтобы он попал в Upload)
                mkdir -p bin
                cp build.log bin/build_failure.log
                exit 1
            }
        fi
        
        echo "=========================================="
        echo "       [COMPILE SUMMARY]                  "
        echo "=========================================="
        echo "Compilation finished successfully."
        echo "Firmware Date: $(date +"%Y%m%d%H%M")"
        echo "=========================================="

    - name: Save Bootloader files (Deep Search)
      run: |
        cd openwrt
        mkdir -p bin/u-boot-files
        
        echo ">>> Starting deep search for Bootloader binaries..."
        
        # 1. Прямой поиск специфичных файлов для Rockchip (R5S, R6S)
        # Мы ищем прямо в папке, где они компилировались (build_dir)
        find build_dir/target-* -name "idbloader.img" -type f -exec cp -vf {} bin/u-boot-files/ \;
        find build_dir/target-* -name "u-boot.itb" -type f -exec cp -vf {} bin/u-boot-files/ \;
        
        # 2. Прямой поиск для MediaTek (Filogic/SlateAX/AX59U)
        # Обычно это файлы с расширением .fip или .bin внутри папки u-boot
        find build_dir/target-* -name "*.fip" -type f -exec cp -vf {} bin/u-boot-files/ \;
        find build_dir/target-* -name "u-boot.bin" -type f -path "*/u-boot-*" -exec cp -vf {} bin/u-boot-files/ \;

        # 3. Дополнительный поиск, если файлы уже переименованы системой
        # Ищем в папке bin/targets, исключая пакеты (.apk/.ipk)
        find bin/targets -type f -name "*idbloader.img" -exec cp -vf {} bin/u-boot-files/ \;
        find bin/targets -type f -name "*u-boot.itb" -exec cp -vf {} bin/u-boot-files/ \;
        find bin/targets -type f -name "u-boot.elf" -exec cp -vf {} bin/u-boot-files/ \;
        
        echo ">>> ------------------------------------------------"
        echo ">>> SAVED BOOTLOADER FILES:"
        ls -lh bin/u-boot-files/
        echo ">>> ------------------------------------------------"
    
    - name: Generate Date
      id: get_date
      # always(): нужно, чтобы при падении Compile имя артефакта не теряло дату.
      if: ${{ always() }}
      run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
    
    - name: Upload
      # always(): при падении Compile шаг копирует build.log в bin/build_failure.log;
      # без always() Upload (по умолчанию success()) пропускался и лог не загружался.
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        # Порядок: устройство, source, ветка, вариант, патчи, agh, sb, ytb,
        # zz1, фиды (feeds-tag / feeds-repo), дата. Все параметры сборки в имени: в combo бывает несколько
        # сборок одного устройства и варианта (например homeproxy с 1.12.x и
        # latest), а дата — до минуты; одинаковое имя upload-artifact отверг бы.
        name: ${{ matrix.target }}_${{ inputs.source }}_${{ inputs.branch }}_${{ matrix.vname }}_${{ matrix.patches && 'patches' || 'nopatches' }}_agh-${{ matrix.agh }}_sb-${{ matrix.sb }}_${{ matrix.ytb && 'ytb' || 'noytb' }}_${{ matrix.zz && 'zz' || 'nozz' }}${{ matrix.feeds && '_feeds-repo' || '_feeds-tag' }}_${{ steps.get_date.outputs.date }}
        path: openwrt/bin
        # На ранней ошибке (до создания bin/) не валим джоб красным "no files".
        if-no-files-found: warn
        retention-days: 10

  notify:
    # Одно уведомление в Telegram после ВСЕЙ матрицы — со статусом каждой
    # сборки. always(): сообщение нужно и при падении, и при отмене.
    #
    # Приватность:
    #   * токен бота и chat_id хранятся ТОЛЬКО в Secrets репозитория, в yml
    #     их нет; GitHub маскирует значения секретов в логах;
    #   * ответ Telegram API в лог не выводится — в нём chat.id, имя и
    #     username получателя; при ошибке печатается только код и описание;
    #   * без секретов шаг тихо пропускается — запуск из форка не упадёт.
    needs: [setup, build]
    if: always()
    runs-on: ${{ inputs.runner_os }}
    permissions:
      # write — для удаления старых запусков (шаг ниже)
      actions: write
    steps:
    - name: Telegram notification
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        MODE: ${{ inputs.target }}
        SRC: ${{ inputs.source }}
        BRANCH: ${{ inputs.branch }}
        RUNNER: ${{ inputs.runner_os }}
        SETUP_RESULT: ${{ needs.setup.result }}
        BUILD_RESULT: ${{ needs.build.result }}
      run: |
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
          echo "::notice::Секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы — уведомление пропущено."
          exit 0
        fi

        # Экранирование для parse_mode=HTML
        esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

        # needs.build.result — только общий итог матрицы. Статус и длительность
        # каждой сборки берём из списка джобов текущего запуска.
        # Сборки узнаются по имени: «... [вариант] - устройство (sb:...)».
        JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" 2>/dev/null) || JOBS=""
        LINES=$(printf '%s' "$JOBS" | jq -r '
          .jobs[]? | select(.name | contains("] - ")) |
          (if   .conclusion == "success"   then "✅"
           elif .conclusion == "failure"   then "❌"
           elif .conclusion == "cancelled" then "⏹"
           elif .conclusion == "skipped"   then "⏭"
           else "❔" end) as $icon |
          (if .started_at and .completed_at
             then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 | floor)
             else 0 end) as $min |
          "\($icon) \(.name | sub("^[^\\[]*"; "")) — \($min / 60 | floor)ч \($min % 60)м"
        ' 2>/dev/null) || LINES=""
        OK=$(printf '%s' "$JOBS" | jq '[.jobs[]? | select(.name | contains("] - ")) | select(.conclusion == "success")] | length' 2>/dev/null) || OK=""
        ALL=$(printf '%s' "$JOBS" | jq '[.jobs[]? | select(.name | contains("] - "))] | length' 2>/dev/null) || ALL=""
        # jq на пустом входе ничего не печатает — тогда строку счётчика не выводим
        COUNT_LINE=""
        if [ -n "$ALL" ] && [ "$ALL" != "0" ]; then
          COUNT_LINE="Успешно: ${OK} из ${ALL}"
        fi

        if [ "$SETUP_RESULT" != "success" ]; then
          HEAD="❌ Матрица не сформирована (setup: $SETUP_RESULT)"
        else
          case "$BUILD_RESULT" in
            success)   HEAD="✅ Сборка завершена" ;;
            failure)   HEAD="❌ Сборка с ошибками" ;;
            cancelled) HEAD="⏹ Сборка отменена" ;;
            *)         HEAD="❔ Сборка: $BUILD_RESULT" ;;
          esac
        fi

        # Собираем построчно: пустые части не оставляют «дыр» в сообщении
        {
          printf '<b>%s</b>\n' "$(printf '%s' "$HEAD" | esc)"
          printf '%s · %s · %s · %s\n' "$SRC" "$BRANCH" "$MODE" "$RUNNER" | esc
          [ -n "$COUNT_LINE" ] && printf '%s\n' "$COUNT_LINE"
          printf '\n%s\n\n' "$(printf '%s' "${LINES:-(список сборок недоступен)}" | esc)"
          printf '<a href="%s">Открыть запуск</a>' "$RUN_URL"
        } > /tmp/tg_text.txt
        TEXT=$(cat /tmp/tg_text.txt)
        rm -f /tmp/tg_text.txt

        HTTP=$(curl -sS -o /tmp/tg.json -w '%{http_code}' --max-time 20 \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT}" \
          --data-urlencode "text=${TEXT}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_web_page_preview=true" 2>/dev/null) || HTTP="000"

        if [ "$HTTP" = "200" ]; then
          echo ">>> Уведомление в Telegram отправлено."
        else
          # Только код и описание ошибки — без данных получателя из ответа.
          # Шаг не валится: неотправленное уведомление не должно красить запуск.
          echo "::warning::Telegram API ответил HTTP $HTTP: $(jq -r '.description // "нет ответа"' /tmp/tg.json 2>/dev/null)"
        fi
        rm -f /tmp/tg.json

    - name: Delete workflow runs
      # Один раз на запуск, а не в каждой сборке матрицы (раньше в combo
      # шаг выполнялся 4 раза параллельно и дрался за одни и те же run'ы).
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # checkout в этой джобе нет — репозиторий для gh задаём явно
        GH_REPO: ${{ github.repository }}
      run: |
        echo ">>> Deleting workflow runs older than 10 days..."
        
        # 1. Вычисляем дату "10 дней назад" в UTC с суффиксом Z.
        # ВАЖНО: GitHub createdAt всегда в UTC ('...Z'), а jq ниже сравнивает СТРОКИ.
        # При TZ=Europe/Moscow обычный 'date -Iseconds' даёт '+03:00' -> строковое
        # сравнение с 'Z'-датами врёт в окне ±3ч вокруг границы. Поэтому форсим UTC+Z.
        CUTOFF_DATE=$(date -u -d "10 days ago" +"%Y-%m-%dT%H:%M:%SZ")
        echo ">>> Cutoff date (UTC): $CUTOFF_DATE"
        
        # 2. Получаем список запусков и фильтруем через jq те, что старше CUTOFF_DATE
        RUN_IDS=$(gh run list --limit 100 --json databaseId,createdAt --jq ".[] | select(.createdAt < \"$CUTOFF_DATE\") | .databaseId")
        
        # 3. Удаляем найденные запуски
        if [ -z "$RUN_IDS" ]; then
          echo ">>> No old runs found to delete."
        else
          for ID in $RUN_IDS; do
            echo ">>> Deleting run ID: $ID"
            gh run delete "$ID" || echo "Failed to delete $ID (maybe currently running)"
          done
        fi
